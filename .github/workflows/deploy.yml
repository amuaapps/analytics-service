name: Deploy Analytics Service

on:
  push:
    branches:
      - develop
      - release
      - main
    paths:
      - 'src/**'
      - 'infra/**'
      - 'scripts/**'
      - 'package*.json'
      - 'tsconfig.json'
      - '.github/workflows/deploy*.yml'
  pull_request:
    branches:
      - develop
      - release
      - main
  workflow_dispatch:
    inputs:
      cloud:
        description: 'Target cloud provider'
        required: false
        type: choice
        options:
          - auto
          - azure
          - aws
        default: auto
      environment:
        description: 'Target environment'
        required: false
        type: choice
        options:
          - auto
          - dev
          - staging
          - prod
        default: auto

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment != 'auto' && github.event.inputs.environment || (github.ref_name == 'develop' && 'dev') || (github.ref_name == 'release' && 'staging') || (github.ref_name == 'main' && 'prod') || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  actions: read

env:
  NODE_VERSION: '20.x'
  PROJECT_NAME: 'analytics-service'

jobs:
  # ============================================================================
  # STAGE 0: Context & Decision
  # ============================================================================
  context:
    name: Context
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
    steps:
      - name: Detect environment from branch
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.environment }}" != "auto" ]; then
            ENV="${{ inputs.environment }}"
          else
            case "${{ github.ref_name }}" in
              develop) ENV="dev" ;;
              release) ENV="staging" ;;
              main) ENV="prod" ;;
              *)
                echo "::error::Unsupported branch: ${{ github.ref_name }}"
                exit 1
                ;;
            esac
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "Detected environment: $ENV"

  decide:
    name: Decide Cloud
    runs-on: ubuntu-latest
    needs: context
    environment: ${{ needs.context.outputs.environment }}
    outputs:
      cloud: ${{ steps.detect.outputs.cloud }}
    steps:
      - name: Detect cloud provider
        id: detect
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
        run: |
          CLOUD_INPUT="${{ inputs.cloud }}"
          
          if [ "$CLOUD_INPUT" = "" ] || [ "$CLOUD_INPUT" = "auto" ]; then
            # Auto-detect based on environment variables
            if [ -n "$AZURE_CLIENT_ID" ] && [ -z "$AWS_ROLE_TO_ASSUME" ]; then
              CLOUD="azure"
            elif [ -z "$AZURE_CLIENT_ID" ] && [ -n "$AWS_ROLE_TO_ASSUME" ]; then
              CLOUD="aws"
            elif [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AWS_ROLE_TO_ASSUME" ]; then
              echo "::error::Both Azure and AWS configured. Specify cloud explicitly."
              exit 1
            else
              echo "::error::No cloud provider configured for ${{ needs.context.outputs.environment }}"
              exit 1
            fi
          else
            CLOUD="$CLOUD_INPUT"
          fi
          
          echo "cloud=$CLOUD" >> $GITHUB_OUTPUT
          echo "Selected cloud: $CLOUD"

  # ============================================================================
  # STAGE 1: Test
  # ============================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: context
    if: always() && (needs.context.result == 'success' || github.event_name == 'pull_request')
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: CodeQL init
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: CodeQL autobuild
        uses: github/codeql-action/autobuild@v3

      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v3

  # ============================================================================
  # STAGE 2: Build
  # ============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [context, decide, test]
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --audit-level=critical

      - name: Build TypeScript
        run: npm run build

      - name: Create deployment package
        run: |
          mkdir -p deployment
          cp -r dist/* deployment/
          cp package.json package-lock.json deployment/
          cd deployment
          # Fix package.json main field to point to correct path
          sed -i.bak 's|"main": "dist/index.js"|"main": "index.js"|' package.json
          rm package.json.bak
          npm ci --production --ignore-scripts
          cd ..

      - name: Add Azure Functions host.json
        if: needs.decide.outputs.cloud == 'azure'
        run: cp host.json deployment/

      - name: Create deployment ZIP
        run: |
          cd deployment
          zip -r ../deployment.zip .
          cd ..
          ls -lh deployment.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deployment.zip
          retention-days: 30

  # ============================================================================
  # STAGE 3: Deploy GREEN (Azure)
  # ============================================================================
  deploy_azure:
    name: Deploy GREEN (Azure)
    runs-on: ubuntu-latest
    needs: [context, decide, build]
    if: needs.decide.outputs.cloud == 'azure'
    environment: ${{ needs.context.outputs.environment }}
    outputs:
      green_url: ${{ steps.deploy.outputs.green_url }}
      green_id: ${{ steps.deploy.outputs.green_id }}
      blue_id: ${{ steps.deploy.outputs.blue_id }}
      active_url: ${{ steps.deploy.outputs.active_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Bicep
        run: az bicep install

      - name: Ensure resource group exists
        run: |
          RESOURCE_GROUP="${PROJECT_NAME}-${{ needs.context.outputs.environment }}-rg"
          LOCATION="${{ vars.AZURE_LOCATION || 'northeurope' }}"
          
          if ! az group show --name "$RESOURCE_GROUP" &>/dev/null; then
            echo "Creating resource group: $RESOURCE_GROUP"
            az group create --name "$RESOURCE_GROUP" --location "$LOCATION"
          else
            echo "Resource group already exists: $RESOURCE_GROUP"
          fi

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package
          path: ./artifacts

      - name: Deploy GREEN (staging slot)
        id: deploy
        env:
          AZURE_RESOURCE_GROUP: ${{ env.PROJECT_NAME }}-${{ needs.context.outputs.environment }}-rg
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'northeurope' }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          ENVIRONMENT: ${{ needs.context.outputs.environment }}
          ARTIFACT_DIR: ./artifacts
          ANALYTICS_WRITE_KEY: ${{ secrets.ANALYTICS_WRITE_KEY || '' }}
          AZURE_FUNCTION_APP_NAME: ${{ vars.AZURE_FUNCTION_APP_NAME || '' }}
          AZURE_FUNCTION_SKU: ${{ vars.AZURE_FUNCTION_SKU || 'Y1' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || (needs.context.outputs.environment == 'prod' && 'info' || 'debug') }}
          CORS_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS || '*' }}
        run: |
          chmod +x scripts/ci/deploy-azure-green.sh
          ./scripts/ci/deploy-azure-green.sh

      - name: Debug - List deployed functions
        run: |
          FUNCTION_APP_NAME="${{ env.PROJECT_NAME }}-func-${{ needs.context.outputs.environment }}"
          RESOURCE_GROUP="${{ env.PROJECT_NAME }}-${{ needs.context.outputs.environment }}-rg"
          
          echo "📋 Listing functions in staging slot:"
          az functionapp function list \
            --name "$FUNCTION_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --slot staging \
            --query "[].{Name:name, TriggerType:config.bindings[0].type}" \
            --output table || echo "Failed to list functions"
          
          echo ""
          echo "📋 Checking Function App status:"
          az functionapp show \
            --name "$FUNCTION_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --slot staging \
            --query "{State:state, HostNames:enabledHostNames}" \
            --output json

      - name: Debug - Check Function App logs
        run: |
          FUNCTION_APP_NAME="${{ env.PROJECT_NAME }}-func-${{ needs.context.outputs.environment }}"
          
          echo "📋 Recent Function App logs:"
          az webapp log tail \
            --name "$FUNCTION_APP_NAME" \
            --resource-group "${{ env.PROJECT_NAME }}-${{ needs.context.outputs.environment }}-rg" \
            --slot staging \
            --timeout 10 || echo "Could not fetch logs"

  # ============================================================================
  # STAGE 3: Deploy GREEN (AWS)
  # ============================================================================
  deploy_aws:
    name: Deploy GREEN (AWS)
    runs-on: ubuntu-latest
    needs: [context, decide, build]
    if: needs.decide.outputs.cloud == 'aws'
    environment: ${{ needs.context.outputs.environment }}
    outputs:
      green_url: ${{ steps.deploy.outputs.green_url }}
      green_id: ${{ steps.deploy.outputs.green_id }}
      blue_id: ${{ steps.deploy.outputs.blue_id }}
      active_url: ${{ steps.deploy.outputs.active_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS Login (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package
          path: ./artifacts

      - name: Deploy GREEN
        id: deploy
        env:
          ENVIRONMENT: ${{ needs.context.outputs.environment }}
          ARTIFACT_DIR: ./artifacts
        run: |
          echo "::error::AWS deployment not yet implemented"
          echo "TODO: Implement scripts/ci/deploy-aws-green.sh"
          exit 1

  # ============================================================================
  # STAGE 4: Verify & Switch (Azure)
  # ============================================================================
  verify_switch_azure:
    name: Verify & Switch (Azure)
    runs-on: ubuntu-latest
    needs: [context, decide, deploy_azure]
    if: needs.decide.outputs.cloud == 'azure'
    environment:
      name: ${{ needs.context.outputs.environment }}
      url: ${{ needs.deploy_azure.outputs.active_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify GREEN deployment
        run: |
          GREEN_URL="${{ needs.deploy_azure.outputs.green_url }}"
          echo "Verifying GREEN deployment at: $GREEN_URL"
          
          # Wait for function app to be ready
          MAX_ATTEMPTS=30
          ATTEMPT=0
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Checking health endpoints..."
            
            # Try /api/v1/health (matches routePrefix in host.json)
            echo "  Trying: ${GREEN_URL}/api/v1/health"
            RESPONSE=$(curl -s -w "\n%{http_code}" "${GREEN_URL}/api/v1/health" 2>&1 || echo "000")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n-1)
            
            echo "  Response code: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "  Response body: $BODY"
              echo "✅ GREEN deployment is healthy"
              exit 0
            fi
            
            echo "  Response: HTTP $HTTP_CODE"
            [ -n "$BODY" ] && echo "  Body: $BODY"
            sleep 10
          done
          
          echo "::error::GREEN deployment failed health check after $MAX_ATTEMPTS attempts"
          echo "Last response from /api/health: HTTP $HTTP_CODE"
          exit 1

      - name: Switch traffic to GREEN
        env:
          AZURE_RESOURCE_GROUP: ${{ env.PROJECT_NAME }}-${{ needs.context.outputs.environment }}-rg
          AZURE_FUNCTION_APP_NAME: ${{ env.PROJECT_NAME }}-func-${{ needs.context.outputs.environment }}
          GREEN_ID: ${{ needs.deploy_azure.outputs.green_id }}
          BLUE_ID: ${{ needs.deploy_azure.outputs.blue_id }}
        run: |
          chmod +x scripts/ci/switch-azure-bluegreen.sh
          ./scripts/ci/switch-azure-bluegreen.sh

      - name: Verify production after switch
        run: |
          ACTIVE_URL="${{ needs.deploy_azure.outputs.active_url }}"
          echo "Verifying production after switch: $ACTIVE_URL"
          
          sleep 15  # Allow DNS/routing to propagate
          
          if curl -sf "${ACTIVE_URL}/api/v1/health" > /dev/null 2>&1; then
            echo "✅ Production is healthy after switch"
          else
            echo "::error::Production health check failed after switch"
            echo "::warning::Consider manual rollback if needed"
            exit 1
          fi

  # ============================================================================
  # STAGE 4: Verify & Switch (AWS)
  # ============================================================================
  verify_switch_aws:
    name: Verify & Switch (AWS)
    runs-on: ubuntu-latest
    needs: [context, decide, deploy_aws]
    if: needs.decide.outputs.cloud == 'aws'
    environment:
      name: ${{ needs.context.outputs.environment }}
      url: ${{ needs.deploy_aws.outputs.active_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AWS Login (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Verify & Switch
        run: |
          echo "::error::AWS verify & switch not yet implemented"
          echo "TODO: Implement verification and traffic switching for AWS"
          exit 1
